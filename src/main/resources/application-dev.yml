spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    clean-on-validation-error: false
    out-of-order: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dev-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dev-client-secret}

jwt:
  secret: ${JWT_SECRET:dev-secret-key-at-least-32-characters-long-for-hs256}
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

logging:
  level:
    com.collabflow: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.socket: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
