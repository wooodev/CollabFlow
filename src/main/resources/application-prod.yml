spring:
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 30000

  mail:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

server:
  port: 8080
  tomcat:
    max-threads: 200
    min-spare-threads: 20
  compression:
    enabled: true
    mime-types: application/json,text/html,text/plain
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        # 운영에서는 prometheus, health만 외부 노출
        include: health, prometheus
  endpoint:
    health:
      show-details: never
  server:
    # 액추에이터를 별도 내부 포트로 분리 (선택)
    # port: 9090

logging:
  level:
    com.collabflow: WARN
    org.springframework: WARN
    org.hibernate: WARN
  file:
    name: /var/log/collabflow/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 3GB

springdoc:
  swagger-ui:
    enabled: false   # 운영에서는 Swagger UI 비활성화
  api-docs:
    enabled: false
