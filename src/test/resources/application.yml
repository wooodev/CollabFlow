spring:
  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/collabflow
    username: ${DB_USERNAME:collabflow}
    password: ${DB_PASSWORD:collabflow1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1000ms

  mail:
    host: localhost
    port: 1025
    properties:
      mail.smtp.auth: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:test-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:test-client-secret}
            scope: email, profile

jwt:
  secret: ${JWT_SECRET:test-secret-key-at-least-32-characters-long-for-hs256}
  access-token-expiry: 3600000
  refresh-token-expiry: 604800000

app:
  frontend-url: http://localhost:3000
  mail-from: test@collabflow.io
  invitation-expiry-hours: 72

logging:
  level:
    com.collabflow: WARN
    org.springframework: WARN
