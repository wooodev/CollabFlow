version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: collabflow-postgres
    environment:
      POSTGRES_DB: collabflow
      POSTGRES_USER: ${DB_USERNAME:-collabflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-collabflow1234}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-collabflow} -d collabflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: collabflow-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: collabflow-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI (http://localhost:8025)

volumes:
  postgres_data:
  redis_data:
